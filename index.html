<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

h3 {
    padding: 15px;
}

.tabs {
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    gap: 10px;
    padding: 20px;
    touch-action: pan-x;
}

.tab {
    min-width: 140px;
    padding: 30px 20px;
    background: #ddd;
    text-align: center;
    border-radius: 8px;
}
</style>
</head>

<body>

<h3>Horizontal Swipe Test</h3>

<div class="tabs">
    <div class="tab">TAB 1</div>
    <div class="tab">TAB 2</div>
    <div class="tab">TAB 3</div>
    <div class="tab">TAB 4</div>
    <div class="tab">TAB 5</div>
    <div class="tab">TAB 6</div>
    <div class="tab">TAB 7</div>
    <div class="tab">TAB 8</div>
</div>
    <script>
const tabs = document.querySelector(".tabs");

let startX = 0;

tabs.addEventListener("touchstart", function(e) {
    startX = e.touches[0].clientX;
}, { passive: true });

tabs.addEventListener("touchend", function(e) {
    const endX = e.changedTouches[0].clientX;
    const dx = endX - startX;

    if (Math.abs(dx) > 50) {
        tabs.scrollBy({
            left: -dx,
            behavior: "smooth"
        });
    }
}, { passive: true });
</script>

</body>
</html>
